services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ticketing_db
      POSTGRES_USER: ticketing
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketing -d ticketing_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    image: ${IMAGE_NAME:-ghcr.io/cocorine999/ticketing-api}:${IMAGE_TAG:-latest}
    restart: always
    env_file: .env
    environment:
      CONTAINER_ROLE: web
      APP_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
    volumes:
      - storage_app:/var/www/html/storage/app
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"

  worker:
    image: ${IMAGE_NAME:-ghcr.io/cocorine999/ticketing-api}:${IMAGE_TAG:-latest}
    restart: always
    env_file: .env
    environment:
      CONTAINER_ROLE: worker
      APP_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
    volumes:
      - storage_app:/var/www/html/storage/app
    depends_on:
      postgres:
        condition: service_healthy

  broadcasting:
    image: ${IMAGE_NAME:-ghcr.io/cocorine999/ticketing-api}:${IMAGE_TAG:-latest}
    restart: always
    env_file: .env
    environment:
      CONTAINER_ROLE: broadcasting
      APP_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"

  scheduler:
    image: ${IMAGE_NAME:-ghcr.io/cocorine999/ticketing-api}:${IMAGE_TAG:-latest}
    restart: always
    env_file: .env
    environment:
      CONTAINER_ROLE: scheduler
      APP_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - broadcasting

volumes:
  pgdata:
  storage_app:
  caddy_data:
  caddy_config:

name: Build and Deploy to EC2 (GHCR + Docker Compose)

on:
  push:
    branches: [main]
    paths:
      - 'ticketing-api-rest-app/**'
      - '.github/workflows/docker-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/ticketing-api
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./ticketing-api-rest-app
          file: ./ticketing-api-rest-app/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 15
    steps:
      - name: Configure SSH key
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy via SSH (pull image + compose up)
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
          IMAGE_TAG: ${{ github.sha }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          # APP_DIR = racine du monorepo clonée sur l'EC2 (repo cocorine999/ticketing_backend)
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key "${EC2_USER}@${EC2_HOST}" "
            set -e
            cd /home/ubuntu/app/ticketing_backend
            git pull --ff-only
            cd ticketing-api-rest-app
            export IMAGE_TAG='${IMAGE_TAG}'
            export IMAGE_NAME='${IMAGE_NAME}'
            docker compose pull web worker broadcasting scheduler
            docker compose up -d --remove-orphans
            docker compose exec -T web php artisan migrate --force
            docker compose exec -T web php artisan config:cache
            docker compose exec -T web php artisan route:cache
            docker compose exec -T web php artisan view:cache
            docker image prune -f
          "
